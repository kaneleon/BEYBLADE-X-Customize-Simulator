<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BEYBLADE X 物理補正カスタムシミュレーター (データ完全同期版)</title>
<style>
  :root {
    --primary: #00f3ff;
    --secondary: #ff0055;
    --bg-color: #0b0c10;
    --card-bg: #161821;
    --card-inner: #0f1118;
    --border-color: #2a2e3d;
    --text-main: #f0f2f5;
    --text-muted: #94a3b8;

    /* ステータスバー用カラー */
    --attack-color: #ff4b4b;
    --defense-color: #10b981;
    --stamina-color: #f59e0b;
    --dash-color: #06b6d4;
    --burst-color: #a855f7;
    --height-color: #8b5cf6;

    /* タイプ別枠色指定 */
    --type-attack: #3b82f6;   /* アタック：青 */
    --type-stamina: #eab308;  /* スタミナ：黄 */
    --type-defense: #10b981;  /* ディフェンス：緑 */
    --type-balance: #ff4b4b;  /* バランス：赤 */
    --type-other: #a855f7;    /* その他：紫 */
    
    --sab: env(safe-area-inset-bottom, 0px);
    --sat: env(safe-area-inset-top, 0px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Hiragino Sans", "Helvetica Neue", sans-serif;
    padding: calc(var(--sat) + 12px) 12px calc(var(--sab) + 24px) 12px;
    line-height: 1.4;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border-color);
  }

  header h1 {
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 0.05em;
  }

  header h1 span {
    color: var(--primary);
    text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
  }

  header p {
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  select, button, input {
    font-size: 16px !important;
    touch-action: manipulation;
    font-family: inherit;
  }

  .nav-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 4px;
    background-color: #1e2230;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
  }

  .tab-btn.active {
    background-color: var(--primary);
    color: #050b14;
    border-color: var(--primary);
    box-shadow: 0 0 12px rgba(0, 243, 255, 0.3);
  }

  .tab-content {
    display: none !important;
  }
  .tab-content.active {
    display: block !important;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(1, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  @media (min-width: 640px) {
    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  .select-card {
    background-color: var(--card-bg);
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.05);
  }

  .select-card-header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .select-card label {
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--primary);
  }

  .badge-influence {
    font-size: 0.65rem;
    background-color: #222736;
    color: var(--text-muted);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .select-card select {
    width: 100%;
    background-color: var(--card-inner);
    border: 1px solid var(--border-color);
    color: #ffffff;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 10px;
    outline: none;
  }

  .img-box {
    width: 110px;
    height: 110px;
    background-color: #000;
    border-radius: 10px;
    border: 3px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    margin-bottom: 10px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .img-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .img-control-btns {
    display: flex;
    gap: 6px;
    width: 100%;
  }

  .upload-label-btn {
    flex: 1;
    background-color: #222736;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 6px 4px;
    border-radius: 6px;
    font-size: 0.7rem !important;
    text-align: center;
    cursor: pointer;
    display: block;
  }

  .upload-label-btn:active {
    background-color: var(--primary);
    color: #000;
  }

  .reset-img-btn {
    background-color: rgba(255, 0, 85, 0.2);
    border: 1px solid var(--secondary);
    color: #ff4b4b;
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.7rem !important;
    cursor: pointer;
  }

  .svg-icon {
    width: 75px;
    height: 75px;
  }

  .result-card {
    background-color: var(--card-bg);
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }

  .result-header h2 {
    font-size: 0.95rem;
    font-weight: bold;
    color: var(--secondary);
  }

  .total-weight-box {
    font-size: 0.85rem;
    color: var(--text-main);
  }

  .total-weight-val {
    font-size: 1.5rem;
    font-weight: 900;
    color: var(--primary);
    margin-left: 4px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  @media (min-width: 640px) {
    .stats-grid {
      grid-template-columns: 1fr 1fr;
      column-gap: 20px;
    }
  }

  .stat-group {
    margin-bottom: 4px;
  }

  .stat-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.75rem;
    font-weight: bold;
    margin-bottom: 3px;
  }

  .stat-bar-bg {
    width: 100%;
    height: 8px;
    background-color: #1a1e2b;
    border-radius: 4px;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    width: 0%;
    transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .physics-notes {
    background-color: rgba(15, 17, 24, 0.9);
    padding: 10px 12px;
    border-radius: 8px;
    border-left: 3px solid var(--primary);
    font-size: 0.75rem;
    line-height: 1.5;
    color: var(--text-muted);
    margin-top: 12px;
  }

  .filter-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .filter-btn {
    flex: 1;
    min-width: 90px;
    padding: 8px 10px;
    background-color: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-main);
    border-radius: 20px;
    font-size: 0.75rem !important;
    cursor: pointer;
    text-align: center;
  }

  .filter-btn.active {
    background-color: #2563eb;
    border-color: #60a5fa;
    color: #ffffff;
    font-weight: bold;
  }

  .recommend-grid {
    display: grid;
    grid-template-columns: repeat(1, 1fr);
    gap: 10px;
  }
  @media (min-width: 640px) {
    .recommend-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .recommend-card {
    background-color: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 12px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .rank-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    background-color: var(--secondary);
    color: #fff;
    font-size: 0.65rem;
    font-weight: 900;
    padding: 2px 8px;
    border-radius: 10px;
  }

  .recommend-card h3 {
    font-size: 0.85rem;
    color: var(--primary);
    padding-right: 55px;
    margin-bottom: 6px;
  }

  .combo-detail {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .score-display {
    background-color: var(--card-inner);
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.75rem;
    margin-bottom: 10px;
  }

  .apply-btn {
    width: 100%;
    padding: 10px;
    background-color: var(--primary);
    color: #050b14;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 0.8rem !important;
    cursor: pointer;
  }

  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    max-height: 60vh;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
    min-width: 650px;
    text-align: left;
  }

  th {
    background-color: #1e2230;
    color: var(--text-muted);
    padding: 10px 8px;
    position: sticky;
    top: 0;
    z-index: 2;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 1px solid var(--border-color);
  }

  td {
    padding: 8px;
    border-bottom: 1px solid rgba(42, 46, 61, 0.5);
    background-color: var(--card-bg);
    white-space: nowrap;
  }

  .part-icon-sm {
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    border-radius: 6px;
    border: 2px solid var(--border-color);
    overflow: hidden;
    background-color: #000;
  }
  .part-icon-sm img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>BEYBLADE X <span>全パーツ型番完全網羅シミュレーター</span></h1>
    <p>実データ同期版 / 自動圧縮永続保存 / タイプ別カラー枠表示</p>
  </header>

  <nav class="nav-tabs" role="tablist">
    <button type="button" id="tab-btn-simulator" onclick="app.switchTab('simulator')" class="tab-btn active">
      シミュレーター
    </button>
    <button type="button" id="tab-btn-recommend" onclick="app.switchTab('recommend')" class="tab-btn">
      おすすめ提案
    </button>
    <button type="button" id="tab-btn-partsList" onclick="app.switchTab('partsList')" class="tab-btn">
      パーツ比較表
    </button>
  </nav>

  <!-- 1. シミュレーター タブ -->
  <main id="tab-simulator" class="tab-content active">
    <div class="grid-3">
      <!-- ブレード -->
      <div class="select-card">
        <div class="select-card-header">
          <label for="bladeSelect">ブレード (Blade)</label>
          <span class="badge-influence">影響度: 100%</span>
        </div>
        <select id="bladeSelect" onchange="app.updateSim()"></select>
        <div class="img-box" id="bladeImg"></div>
        <div class="img-control-btns">
          <label class="upload-label-btn">
            📷 画像を登録
            <input type="file" accept="image/*" onchange="app.handleImageUpload('blade', this)" style="display:none;">
          </label>
          <button type="button" class="reset-img-btn" onclick="app.resetPartImage('blade')">消去</button>
        </div>
      </div>

      <!-- ラチェット -->
      <div class="select-card">
        <div class="select-card-header">
          <label for="ratchetSelect">ラチェット (Ratchet)</label>
          <span class="badge-influence">影響度: 35%</span>
        </div>
        <select id="ratchetSelect" onchange="app.updateSim()"></select>
        <div class="img-box" id="ratchetImg"></div>
        <div class="img-control-btns">
          <label class="upload-label-btn">
            📷 画像を登録
            <input type="file" accept="image/*" onchange="app.handleImageUpload('ratchet', this)" style="display:none;">
          </label>
          <button type="button" class="reset-img-btn" onclick="app.resetPartImage('ratchet')">消去</button>
        </div>
      </div>

      <!-- ビット -->
      <div class="select-card">
        <div class="select-card-header">
          <label for="bitSelect">ビット (Bit)</label>
          <span class="badge-influence">影響度: 75%</span>
        </div>
        <select id="bitSelect" onchange="app.updateSim()"></select>
        <div class="img-box" id="bitImg"></div>
        <div class="img-control-btns">
          <label class="upload-label-btn">
            📷 画像を登録
            <input type="file" accept="image/*" onchange="app.handleImageUpload('bit', this)" style="display:none;">
          </label>
          <button type="button" class="reset-img-btn" onclick="app.resetPartImage('bit')">消去</button>
        </div>
      </div>
    </div>

    <!-- ステータス表示 -->
    <div class="result-card">
      <div class="result-header">
        <h2>物理補正総合ステータス</h2>
        <div class="total-weight-box">
          総重量: <span id="totalWeight" class="total-weight-val">0.00</span> <span style="font-size:0.7rem;">g</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-group">
          <div class="stat-label-row">
            <span style="color:var(--attack-color)">攻撃 (Attack)</span>
            <span id="valAtk">0</span>
          </div>
          <div class="stat-bar-bg"><div id="barAtk" class="stat-bar-fill" style="background:var(--attack-color)"></div></div>
        </div>

        <div class="stat-group">
          <div class="stat-label-row">
            <span style="color:var(--defense-color)">防御 (Defense)</span>
            <span id="valDef">0</span>
          </div>
          <div class="stat-bar-bg"><div id="barDef" class="stat-bar-fill" style="background:var(--defense-color)"></div></div>
        </div>

        <div class="stat-group">
          <div class="stat-label-row">
            <span style="color:var(--stamina-color)">持久 (Stamina)</span>
            <span id="valSta">0</span>
          </div>
          <div class="stat-bar-bg"><div id="barSta" class="stat-bar-fill" style="background:var(--stamina-color)"></div></div>
        </div>

        <div class="stat-group">
          <div class="stat-label-row">
            <span style="color:var(--dash-color)">ダッシュ (Dash)</span>
            <span id="valDash">0</span>
          </div>
          <div class="stat-bar-bg"><div id="barDash" class="stat-bar-fill" style="background:var(--dash-color)"></div></div>
        </div>

        <div class="stat-group">
          <div class="stat-label-row">
            <span style="color:var(--burst-color)">バースト耐性 (Burst Res)</span>
            <span id="valBrst">0</span>
          </div>
          <div class="stat-bar-bg"><div id="barBrst" class="stat-bar-fill" style="background:var(--burst-color)"></div></div>
        </div>

        <div class="stat-group">
          <div class="stat-label-row">
            <span style="color:var(--height-color)">全高 (Total Height)</span>
            <span id="valHgt">0</span>
          </div>
          <div class="stat-bar-bg"><div id="barHgt" class="stat-bar-fill" style="background:var(--height-color)"></div></div>
        </div>
      </div>

      <div id="physicsNotes" class="physics-notes">計算中...</div>
    </div>
  </main>

  <!-- 2. おすすめ提案 タブ -->
  <main id="tab-recommend" class="tab-content">
    <div class="filter-btns">
      <button type="button" class="filter-btn active" id="rec-atk" onclick="app.generateRecommendations('atk')">攻撃特化</button>
      <button type="button" class="filter-btn" id="rec-def" onclick="app.generateRecommendations('def')">防御特化</button>
      <button type="button" class="filter-btn" id="rec-sta" onclick="app.generateRecommendations('sta')">持久特化</button>
      <button type="button" class="filter-btn" id="rec-dash" onclick="app.generateRecommendations('dash')">ダッシュ特化</button>
      <button type="button" class="filter-btn" id="rec-brst" onclick="app.generateRecommendations('brst')">バースト耐性</button>
      <button type="button" class="filter-btn" id="rec-weight" onclick="app.generateRecommendations('weight')">最重量級</button>
    </div>

    <p style="font-size: 0.7rem; color: var(--text-muted); margin-bottom: 10px;">
      重量・慣性モーメント・全高物理計算に基づいた自動選定組み合わせ（上位6選）
    </p>

    <div id="recommendGrid" class="recommend-grid"></div>
  </main>

  <!-- 3. パーツ比較表 タブ -->
  <main id="tab-partsList" class="tab-content">
    <div class="filter-btns">
      <button type="button" class="filter-btn active" id="f-blades" onclick="app.filterList('blades')">ブレード全種</button>
      <button type="button" class="filter-btn" id="f-ratchets" onclick="app.filterList('ratchets')">ラチェット全種</button>
      <button type="button" class="filter-btn" id="f-bits" onclick="app.filterList('bits')">ビット全種</button>
    </div>

    <div class="table-wrap">
      <table id="dataTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
</div>

<script>
(function() {
  'use strict';

  var INFLUENCE = { blade: 1.00, bit: 0.75, ratchet: 0.35 };

  function getTypeColor(type) {
    if (type === 'アタック') return 'var(--type-attack)';
    if (type === 'スタミナ') return 'var(--type-stamina)';
    if (type === 'ディフェンス') return 'var(--type-defense)';
    if (type === 'バランス') return 'var(--type-balance)';
    return 'var(--type-other)';
  }

  var customImages = {};
  try {
    customImages = JSON.parse(localStorage.getItem('bey_custom_images_v3') || '{}');
  } catch(e) {
    customImages = {};
  }

  // ブレードデータ（全101種類・実データ同期）
  var blades = [
    {code:"BX-01", name:"ドランソード", series:"BX", type:"アタック", weight:34.9, atk:55, def:25, sta:20, dash:5, brst:4, hgt:3, shape:"jagged"},
    {code:"BX-02", name:"ヘルズサイズ", series:"BX", type:"バランス", weight:32.9, atk:30, def:35, sta:35, dash:3, brst:3, hgt:3, shape:"semi_round"},
    {code:"BX-03", name:"ウィザードアロー", series:"BX", type:"スタミナ", weight:31.8, atk:15, def:30, sta:55, dash:1, brst:3, hgt:3, shape:"perfect_round"},
    {code:"BX-04", name:"ナイトシールド", series:"BX", type:"ディフェンス", weight:32.5, atk:20, def:55, sta:25, dash:1, brst:3, hgt:3, shape:"round"},
    {code:"BX-00", name:"コバルトドレイク", series:"BX", type:"アタック", weight:37.2, atk:70, def:35, sta:25, dash:5, brst:6, hgt:3, shape:"jagged"},
    {code:"BX-13", name:"ナイトランス", series:"BX", type:"ディフェンス", weight:32.3, atk:25, def:60, sta:15, dash:1, brst:3, hgt:3, shape:"round"},
    {code:"BX-14", name:"シャークエッジ", series:"BX", type:"アタック", weight:34.5, atk:60, def:25, sta:15, dash:5, brst:4, hgt:3, shape:"jagged"},
    {code:"BX-15", name:"レオンクロー", series:"BX", type:"アタック", weight:31.6, atk:40, def:40, sta:20, dash:5, brst:3, hgt:3, shape:"jagged"},
    {code:"BX-16", name:"ヴァイパーテイル", series:"BX", type:"スタミナ", weight:34.6, atk:30, def:20, sta:50, dash:1, brst:4, hgt:3, shape:"perfect_round"},
    {code:"BX-19", name:"ライノホーン", series:"BX", type:"ディフェンス", weight:32.8, atk:20, def:50, sta:30, dash:1, brst:3, hgt:3, shape:"round"},
    {code:"BX-20", name:"ドランダガー", series:"BX", type:"アタック", weight:34.7, atk:50, def:25, sta:25, dash:5, brst:4, hgt:3, shape:"jagged"},
    {code:"BX-21", name:"ヘルズチェイン", series:"BX", type:"バランス", weight:33.3, atk:35, def:40, sta:25, dash:3, brst:4, hgt:3, shape:"semi_round"},

  function createSVGIcon(type) {
    var color = getTypeColor(type);
    var pathData = '';

    if (type === 'アタック') {
      pathData = '<polygon points="50,15 65,35 90,35 70,55 80,85 50,65 20,85 30,55 10,35 35,35" fill="none" stroke="' + color + '" stroke-width="6"/>';
    } else if (type === 'ディフェンス') {
      pathData = '<polygon points="50,15 85,30 85,70 50,90 15,70 15,30" fill="none" stroke="' + color + '" stroke-width="6"/>';
    } else if (type === 'スタミナ') {
      pathData = '<circle cx="50" cy="50" r="35" fill="none" stroke="' + color + '" stroke-width="6"/><circle cx="50" cy="50" r="15" fill="' + color + '"/>';
    } else if (type === 'ラチェット') {
      pathData = '<rect x="25" y="25" width="50" height="50" rx="10" fill="none" stroke="' + color + '" stroke-width="6"/>';
    } else {
      pathData = '<circle cx="50" cy="50" r="35" fill="none" stroke="' + color + '" stroke-width="5"/><polygon points="50,20 80,75 20,75" fill="none" stroke="' + color + '" stroke-width="5"/>';
    }

    return '<svg class="svg-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + pathData + '</svg>';
  }

  function renderPartDisplay(category, item) {
    if(!item) return '';
    var key = category + '_' + item.name;
    
    if (customImages[key]) {
      return '<img src="' + customImages[key] + '" alt="' + item.name + '">';
    }
    
    var fileNamePrimary = '';
    var fileNameSecondary = '';

    if (category === 'blade') {
      var cleanCode = (item.code || '').replace('-', '').toLowerCase();
      fileNamePrimary = cleanCode + item.name;
      fileNameSecondary = item.code;
    } else if (category === 'ratchet') {
      fileNamePrimary = item.name;
      fileNameSecondary = item.name.replace('-', '');
    } else if (category === 'bit') {
      var cleanBitName = item.name.split(' ')[0];
      fileNamePrimary = cleanBitName;
      fileNameSecondary = cleanBitName.toLowerCase();
    }

    var primaryPath = 'images/' + fileNamePrimary + '.jpg';
    var secondaryPath = 'images/' + fileNameSecondary + '.jpg';
    var svg = createSVGIcon(item.type);
    
    return '<img src="' + primaryPath + '" alt="' + item.name + '" onerror="if(this.src.indexOf(\'' + encodeURIComponent(secondaryPath) + '\')===-1 && !this.getAttribute(\'data-tried\')){this.setAttribute(\'data-tried\',\'1\'); this.src=\'' + secondaryPath + '\';} else {this.onerror=null; this.parentElement.innerHTML=\'' + svg.replace(/'/g, "\\'") + '\';}">';
  }

  function calculatePhysicsStats(bd, rt, bt) {
    if(!bd || !rt || !bt) return { atk:1, def:1, sta:1, dash:1, brst:1, hgt:1, totalWeight:"0.00", ratchetH:60 };

    var totalWeight = bd.weight + rt.weight + bt.weight;
    var ratchetH = rt.heightVal;

    var baseAtk = bd.atk * INFLUENCE.blade + rt.atk * INFLUENCE.ratchet + bt.atk * INFLUENCE.bit;
    var baseDef = bd.def * INFLUENCE.blade + rt.def * INFLUENCE.ratchet + bt.def * INFLUENCE.bit;
    var baseSta = bd.sta * INFLUENCE.blade + rt.sta * INFLUENCE.ratchet + bt.sta * INFLUENCE.bit;
    var baseDash = bd.dash * INFLUENCE.blade + rt.dash * INFLUENCE.ratchet + bt.dash * INFLUENCE.bit;
    var baseBrst = bd.brst * INFLUENCE.blade + rt.brst * INFLUENCE.ratchet + bt.brst * INFLUENCE.bit;
    var baseHgt = bd.hgt * INFLUENCE.blade + rt.hgt * INFLUENCE.ratchet + bt.hgt * INFLUENCE.bit;

    var weightAtkBonus = (totalWeight - 40.0) * 0.45;
    var weightDefBonus = (totalWeight - 40.0) * 0.40;
    var weightStaPenalty = (totalWeight - 40.0) * 0.12;
    var weightBrstBonus = (totalWeight - 40.0) * 0.25;

    var heightAtkBonus = (ratchetH >= 70) ? 1.2 : 0;
    var heightDefBonus = (ratchetH <= 60) ? 1.2 : -1.0;
    var heightBrstBonus = (ratchetH <= 55) ? 1.8 : (ratchetH >= 75) ? -1.5 : 0;

    var shapeAtkBonus = 0, shapeDefBonus = 0, shapeStaBonus = 0;
    if (bd.shape && bd.shape.indexOf("jagged") !== -1) shapeAtkBonus += 1.5;
    if (bd.shape && bd.shape.indexOf("round") !== -1) { shapeDefBonus += 1.2; shapeStaBonus += 1.5; }

    var finalAtk = Math.max(1, baseAtk + weightAtkBonus + heightAtkBonus + shapeAtkBonus);
    var finalDef = Math.max(1, baseDef + weightDefBonus + heightDefBonus + shapeDefBonus);
    var finalSta = Math.max(1, baseSta - weightStaPenalty + shapeStaBonus);
    var finalDash = Math.max(1, baseDash);
    var finalBrst = Math.max(1, baseBrst + weightBrstBonus + heightBrstBonus);
    var finalHgt = Math.max(1, baseHgt + (ratchetH - 60) * 0.15);

    return {
      atk: Number(finalAtk.toFixed(1)),
      def: Number(finalDef.toFixed(1)),
      sta: Number(finalSta.toFixed(1)),
      dash: Number(finalDash.toFixed(1)),
      brst: Number(finalBrst.toFixed(1)),
      hgt: Number(finalHgt.toFixed(1)),
      totalWeight: totalWeight.toFixed(2),
      ratchetH: ratchetH
    };
  }

    handleImageUpload: function(category, input) {
      if (!input.files || !input.files[0]) return;
      var file = input.files[0];

      var reader = new FileReader();
      reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
          var canvas = document.createElement('canvas');
          var ctx = canvas.getContext('2d');
          canvas.width = 150;
          canvas.height = 150;

          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, 150, 150);

          var scale = Math.min(150 / img.width, 150 / img.height);
          var x = (150 - img.width * scale) / 2;
          var y = (150 - img.height * scale) / 2;
          ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

          var resizedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

          var selId = category + 'Select';
          var selEl = document.getElementById(selId);
          if(!selEl) return;

          var items = category === 'blade' ? blades : (category === 'ratchet' ? ratchets : bits);
          var item = items[selEl.value];
          if(!item) return;

          var key = category + '_' + item.name;
          customImages[key] = resizedDataUrl;

          try {
            localStorage.setItem('bey_custom_images_v3', JSON.stringify(customImages));
          } catch(err) {
            alert('保存容量の上限に達しました。');
          }

          app.updateSim();
          if(document.getElementById('tab-partsList').classList.contains('active')) {
            app.renderList();
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
      input.value = '';
    },

    generateRecommendations: function(targetKey) {
      try {
        var btns = document.querySelectorAll('#tab-recommend .filter-btn');
        btns.forEach(function(b) { b.classList.remove('active'); });
        var activeBtn = document.getElementById('rec-' + targetKey);
        if(activeBtn) activeBtn.classList.add('active');

        var combos = [];
        for (var i = 0; i < blades.length; i++) {
          for (var j = 0; j < ratchets.length; j += 4) {
            for (var k = 0; k < bits.length; k += 4) {
              var bd = blades[i];
              var rt = ratchets[j];
              var bt = bits[k];
              var pStats = calculatePhysicsStats(bd, rt, bt);
              var score = targetKey === 'weight' ? Number(pStats.totalWeight) : pStats[targetKey];
              combos.push({
                bIdx: i, rIdx: j, btIdx: k,
                blade: bd, ratchet: rt, bit: bt,
                score: score, weight: Number(pStats.totalWeight)
              });
            }
          }
        }

        combos.sort(function(a, b) { return (b.score - a.score) || (b.weight - a.weight); });

        var topCombos = [];
        var usedBlades = {};
        for (var c = 0; c < combos.length; c++) {
          var item = combos[c];
          if(!usedBlades[item.blade.name]) {
            topCombos.push(item);
            usedBlades[item.blade.name] = true;
          }
          if(topCombos.length >= 6) break;
        }

        var labels = { atk: '攻撃力', def: '防御力', sta: '持久力', dash: 'ダッシュ力', brst: 'バースト耐性', weight: '総重量' };
        var grid = document.getElementById('recommendGrid');
        if(!grid) return;
        grid.innerHTML = '';

        topCombos.forEach(function(c, rank) {
          var scoreText = targetKey === 'weight' ? c.weight.toFixed(2) + ' g' : c.score.toFixed(1) + ' pt';

          var card = document.createElement('div');
          card.className = 'recommend-card';

          var rankBadge = document.createElement('span');
          rankBadge.className = 'rank-badge';
          rankBadge.textContent = 'RANK ' + (rank + 1);

          var title = document.createElement('h3');
          title.textContent = '[' + c.blade.code + '] ' + c.blade.name + ' ' + c.ratchet.name + ' ' + c.bit.name.split(' ')[0];

          var detail = document.createElement('div');
          detail.className = 'combo-detail';
          detail.innerHTML = 'B: [' + c.blade.code + '] ' + c.blade.name + '<br>R: ' + c.ratchet.name + '<br>Bit: ' + c.bit.name;

          var scoreDiv = document.createElement('div');
          scoreDiv.className = 'score-display';
          scoreDiv.innerHTML = '<span style="color:var(--text-muted);">' + labels[targetKey] + ':</span><span style="color:var(--primary); font-weight:bold;">' + scoreText + '</span>';

          var applyBtn = document.createElement('button');
          applyBtn.type = 'button';
          applyBtn.className = 'apply-btn';
          applyBtn.textContent = 'シミュレーターにセット';
          applyBtn.onclick = function() {
            app.applyCombo(c.bIdx, c.rIdx, c.btIdx);
          };

          card.appendChild(rankBadge);
          card.appendChild(title);
          card.appendChild(detail);
          card.appendChild(scoreDiv);
          card.appendChild(applyBtn);

          grid.appendChild(card);
        });
      } catch(err) {
        console.error("Recommend error:", err);
      }
    },

    applyCombo: function(bIdx, rIdx, btIdx) {
      document.getElementById('bladeSelect').value = bIdx;
      document.getElementById('ratchetSelect').value = rIdx;
      document.getElementById('bitSelect').value = btIdx;

      this.switchTab('simulator');
      this.updateSim();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    filterList: function(type) {
      currentListType = type;
      var btns = document.querySelectorAll('#tab-partsList .filter-btn');
      btns.forEach(function(b) { b.classList.remove('active'); });
      var btn = document.getElementById('f-' + type);
      if(btn) btn.classList.add('active');
      this.renderList();
    },

    sortBy: function(key) {
      if(sortKey === key) {
        sortDesc = !sortDesc;
      } else {
        sortKey = key;
        sortDesc = true;
      }
      this.renderList();
    },

    renderList: function() {
      try {
        var categorySingular = currentListType === 'blades' ? 'blade' : (currentListType === 'ratchets' ? 'ratchet' : 'bit');
        var data = currentListType === 'blades' ? blades : (currentListType === 'ratchets' ? ratchets : bits);

        var sorted = data.slice().sort(function(a, b) {
          var va = a[sortKey];
          var vb = b[sortKey];
          if(typeof va === 'string') {
            return sortDesc ? vb.localeCompare(va) : va.localeCompare(vb);
          }
          return sortDesc ? vb - va : va - vb;
        });

        var thead = document.querySelector('#dataTable thead');
        var tbody = document.querySelector('#dataTable tbody');
        if(!thead || !tbody) return;

        var cols = [
          {k: 'code', l: '型番'}, {k: 'name', l: '名前'}, {k: 'series', l: 'シリーズ'}, {k: 'type', l: 'タイプ'}, {k: 'weight', l: '重量(g)'},
          {k: 'atk', l: '攻撃'}, {k: 'def', l: '防御'}, {k: 'sta', l: '持久'},
          {k: 'dash', l: 'ダッシュ'}, {k: 'brst', l: 'バースト'}, {k: 'hgt', l: '高さ'}
        ];

        var trHead = document.createElement('tr');
        var thImg = document.createElement('th');
        thImg.style.textAlign = 'center';
        thImg.textContent = '画像';
        trHead.appendChild(thImg);

        cols.forEach(function(col) {
          var th = document.createElement('th');
          var arrow = sortKey === col.k ? (sortDesc ? ' ▼' : ' ▲') : '';
          th.textContent = col.l + arrow;
          th.onclick = function() { app.sortBy(col.k); };
          trHead.appendChild(th);
        });

        thead.innerHTML = '';
        thead.appendChild(trHead);

        tbody.innerHTML = '';
        sorted.forEach(function(item) {
          var tr = document.createElement('tr');

          var tdImg = document.createElement('td');
          var iconColor = getTypeColor(item.type);
          tdImg.innerHTML = '<div class="part-icon-sm" style="border-color:' + iconColor + ';">' + renderPartDisplay(categorySingular, item) + '</div>';
          tr.appendChild(tdImg);

          cols.forEach(function(col) {
            var td = document.createElement('td');
            var val = item[col.k] !== undefined ? item[col.k] : '-';
            if(col.k === 'weight') val = Number(val).toFixed(1);
            td.textContent = val;
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });
      } catch(err) {
        console.error("List render error:", err);
      }
    }
  };

  function init() {
    populateSelects();
    app.updateSim();
    app.renderList();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
